<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paste.lucafchala.com</title><meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script>(function(){document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'})()</script>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0d0c0a;--border:#252220;--text:#e6e1d6;--muted:#6a6358;--accent:#c08030;--accent-dim:#6a4818;--ctrl-bg:#161412}[data-theme=light]{--bg:#f4efe6;--border:#d8d1c4;--text:#1c1a17;--muted:#9a8f80;--accent:#a06820;--accent-dim:#c89050;--ctrl-bg:#ede8df}html{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}body{min-height:100vh;max-width:680px;margin:0 auto;padding:48px 32px 72px}.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.back{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:color .15s}.back:hover{color:var(--accent)}.controls-inner{display:flex;align-items:center;gap:4px;background:var(--ctrl-bg);border:1px solid var(--border);border-radius:3px;padding:4px 6px}.ctrl-btn{background:none;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:4px 7px;cursor:pointer;transition:color .15s;border-radius:2px;line-height:1}.ctrl-btn:hover{color:var(--accent)}#btn-theme{font-size:15px;padding:2px 7px}header{margin-bottom:40px;animation:rise .9s cubic-bezier(.16,1,.3,1) both}.slug{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,8vw,52px);font-weight:300;line-height:1;letter-spacing:-.02em;margin-bottom:12px;color:var(--accent);word-break:break-word}.micro{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.rule{display:flex;align-items:center;gap:16px;margin:32px 0;color:var(--muted);font-size:10px;letter-spacing:.1em}.rule::before,.rule::after{content:'';flex:1;height:1px;background:var(--border)}.content{animation:rise .9s cubic-bezier(.16,1,.3,1) .1s both}.paste-pre{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word}.paste-link{color:var(--accent);text-decoration:none}.paste-link:hover{text-decoration:underline}.meta{margin-bottom:20px}.meta-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}.meta-row:last-child{border-bottom:none}.meta-label{color:var(--muted);width:90px;flex-shrink:0}.meta-val{color:var(--text);word-break:break-all}.copy-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:6px 14px;cursor:pointer;margin-top:14px;transition:color .15s,border-color .15s}.copy-btn:hover{color:var(--text);border-color:var(--accent-dim)}.copy-btn.ok{color:var(--accent);border-color:var(--accent-dim)}.not-found{font-size:13px;color:var(--muted)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:540px){body{padding:32px 22px 52px}}</style>
</head>
<body>
<div class="controls"><a href="/" class="back">← pastes</a><div class="controls-inner"><button class="ctrl-btn" id="btn-theme" onclick="toggleTheme()">◐</button></div></div>
<header><h1 class="slug" id="paste-slug">…</h1><p class="micro">paste.lucafchala.com</p></header>
<div class="rule" id="paste-rule">PASTE</div>
<div class="content" id="paste-content"><p style="color:var(--muted);font-size:12px">carregando…</p></div>
<script>
const slug=location.pathname.replace(/^\/+|\/+$/g,'');
fetch('/pastes.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{const paste=(data.pastes||[]).find(p=>p.slug===slug);if(!paste){document.getElementById('paste-slug').textContent=slug||'?';document.getElementById('paste-content').innerHTML='<p class="not-found">Paste not found.</p>';return}document.title=paste.slug+' — paste.lucafchala.com';if(paste.lang)document.documentElement.lang=paste.lang==='pt'?'pt-BR':paste.lang;document.getElementById('paste-slug').textContent=paste.slug;document.getElementById('paste-rule').textContent=paste.subtitle||'PASTE';paste.type==='pgp'?renderPgp(paste):renderText(paste)}).catch(()=>{document.getElementById('paste-slug').textContent=slug||'?';document.getElementById('paste-content').innerHTML='<p class="not-found" style="color:var(--muted)">Erro ao carregar paste.</p>'});
function renderText(p){const raw=p.content||'';const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');const linked=esc(raw).replace(/(https?:\/\/[^\s<&]+)/g,url=>{try{if(!/^https?:$/.test(new URL(url).protocol))return url}catch{return url}return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="paste-link">${url}</a>`});document.getElementById('paste-content').innerHTML=`<pre class="paste-pre">${linked}</pre>`}
function renderPgp(p){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');document.getElementById('paste-content').innerHTML=`<div class="meta"><div class="meta-row"><span class="meta-label">fingerprint</span><span class="meta-val">${esc(p.fingerprint||'')}</span></div><div class="meta-row"><span class="meta-label">uid</span><span class="meta-val">Luca F. Chala &lt;luca@lucafchala.com&gt;</span></div></div><pre id="key-block" class="paste-pre" style="margin-top:20px">${esc(p.content||'')}</pre><button class="copy-btn" id="copy-btn" onclick="copyKey()">copy key</button>`}
function copyKey(){const text=document.getElementById('key-block').textContent;const btn=document.getElementById('copy-btn');navigator.clipboard.writeText(text).then(()=>{btn.textContent='copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='copy key';btn.classList.remove('ok')},2000)}).catch(()=>{})}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)}
</script>
</body></html>
